name: Deploy Lambda API

on:
  push:
    branches: [main]
    paths:
      - 'cfn/lambda-api.yml'
      - 'api/**'
      - '.github/workflows/lambda-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lambda-api-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  FRONTEND_URL: https://stardewspeedruns.net

jobs:
  deploy:
    name: Deploy Lambda API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.11.8

      - name: Build Linux Lambda package
        run: |
          LAMBDA_DIR=build/lambda
          uv export --project api --locked --no-dev --no-emit-project --no-header --output-file requirements-lambda.txt
          uv pip install \
            --python-version 3.13 \
            --python-platform x86_64-manylinux2014 \
            --only-binary :all: \
            --require-hashes \
            --no-deps \
            --target "$LAMBDA_DIR" \
            --requirements requirements-lambda.txt
          cp -r api/src/leaderboard_api "$LAMBDA_DIR/leaderboard_api"
          ls -la "$LAMBDA_DIR"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: github-action-role
          aws-region: us-east-1
      
      - name: Upload Lambda package
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          aws cloudformation package \
            --template-file cfn/lambda-api.yml \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-prefix stardew-leaderboard/api/${{ github.sha }} \
            --output-template-file api/build/packaged-api.yml

      # - name: Deploy Lambda API
