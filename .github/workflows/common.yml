name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'cfn/dynamodb.yml'
      - 'cfn/secrets.yml'
      - '.github/workflows/cfn.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infrastructure-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy shared project infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: github-infrastructure
          aws-region: us-east-1

      - name: deploy database
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
            name: leaderboard-ddb
            template: cfn/dynamodb.yml
            no-fail-on-empty-changeset: "1"

      - name: deploy secrets
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
            name: leaderboard-secrets
            template: cfn/secrets.yml
            no-fail-on-empty-changeset: "1"